name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python scripts/release.py --tag "${GITHUB_REF_NAME}" --output dist
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/mati-brain-"${GITHUB_REF_NAME}".zip dist/mati-brain-skill-"${GITHUB_REF_NAME}".zip dist/SHA256SUMS --verify-tag --generate-notes
